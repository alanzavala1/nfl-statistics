name: Deploy to Cloud Run

# Manual trigger so deploys (and any cost) are intentional. Flip to
# `push: {branches: [main]}` for continuous deployment once you're confident.
# `workflow_call` lets refresh.yml deploy after it lands new data — calling this
# workflow rather than duplicating its steps, and avoiding the PAT a
# cross-workflow dispatch would need (GITHUB_TOKEN can't trigger one).
on:
  workflow_dispatch:
  workflow_call:

env:
  REGION: us-central1
  SERVICE: nfldb
  REPO: nfldb            # Artifact Registry repository name

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # required for Workload Identity Federation (keyless OIDC)
    steps:
      - uses: actions/checkout@v4

      # Keyless auth: GitHub's OIDC token is exchanged for short-lived GCP
      # credentials via Workload Identity Federation — no service-account key.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      # The 400MB DuckDB file lives in a GCS bucket (too big for git). Pull it
      # so it gets baked into the image.
      - name: Fetch database from GCS
        run: gcloud storage cp gs://${{ secrets.GCP_DB_BUCKET }}/nfl.duckdb api/data/nfl.duckdb

      - name: Build image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}
        run: docker build --provenance=false -t "$IMAGE" .

      # Gate the release on data integrity: run the reconciliation tests against
      # the DB that's actually baked into the image we're about to ship.
      - name: Verify data integrity in the image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}
        run: docker run --rm "$IMAGE" python -m pytest tests/test_reconciliation.py -q

      - name: Push image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --memory 4Gi --cpu 2 \
            --max-instances 3 \
            --port 8080
